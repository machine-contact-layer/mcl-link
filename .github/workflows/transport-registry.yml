name: Transport registry

on:
  push:
    paths:
      - "registries/transport-ids-v0.1.json"
      - "tools/validate_transport_registry.py"
      - ".github/workflows/transport-registry.yml"
  pull_request:
    paths:
      - "registries/transport-ids-v0.1.json"
      - "tools/validate_transport_registry.py"
      - ".github/workflows/transport-registry.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_transport_registry.py
